kind = "web"
previewPath = "/"
title = "Legal Document Engine"
version = "1.0.0"
id = "artifacts/legal-doc-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22675

[services.development]
run = "pnpm --filter @workspace/legal-doc-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-doc-engine", "run", "build" ]
publicDir = "artifacts/legal-doc-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22675"
BASE_PATH = "/"
